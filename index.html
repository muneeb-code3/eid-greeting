<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eid ul-Adha Mubarak — Blessed Greetings</title>
  <meta name="description" content="A beautiful animated Eid ul-Adha greeting card. Wishing you and your family a blessed Eid." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══════════════════ REPLAY BUTTON ═══════════════════ -->
  <button id="replayBtn" aria-label="Replay Animation">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"></polyline>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
    </svg>
    <span>Replay</span>
  </button>

  <!-- ═══════════════════ BACKGROUND LAYER ═══════════════════ -->
  <div id="bg-layer">
    <!-- Large crescent moon -->
    <svg id="bg-crescent" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#fffbe6" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#fffbe6" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="90" fill="url(#moonGlow)"/>
      <circle cx="100" cy="100" r="60" fill="#fde68a" opacity="0.85"/>
      <circle cx="125" cy="85" r="50" fill="#0f1b35"/>
    </svg>

    <!-- Stars scattered -->
    <div id="stars-container"></div>

    <!-- Mosque silhouette at bottom -->
    <svg id="bg-mosque" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="mosqueGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a1a3e" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#0d0d26" stop-opacity="0.95"/>
        </linearGradient>
      </defs>
      <!-- Main dome -->
      <ellipse cx="600" cy="160" rx="120" ry="100" fill="url(#mosqueGrad)"/>
      <rect x="480" y="160" width="240" height="100" fill="url(#mosqueGrad)"/>
      <!-- Left minaret -->
      <rect x="380" y="80" width="28" height="180" fill="url(#mosqueGrad)"/>
      <ellipse cx="394" cy="80" rx="18" ry="14" fill="url(#mosqueGrad)"/>
      <rect x="389" y="50" width="10" height="30" fill="url(#mosqueGrad)"/>
      <circle cx="394" cy="48" r="6" fill="#fde68a" opacity="0.5"/>
      <!-- Right minaret -->
      <rect x="792" y="80" width="28" height="180" fill="url(#mosqueGrad)"/>
      <ellipse cx="806" cy="80" rx="18" ry="14" fill="url(#mosqueGrad)"/>
      <rect x="801" y="50" width="10" height="30" fill="url(#mosqueGrad)"/>
      <circle cx="806" cy="48" r="6" fill="#fde68a" opacity="0.5"/>
      <!-- Small side domes -->
      <ellipse cx="440" cy="180" rx="50" ry="40" fill="url(#mosqueGrad)"/>
      <ellipse cx="760" cy="180" rx="50" ry="40" fill="url(#mosqueGrad)"/>
      <!-- Base -->
      <rect x="340" y="230" width="520" height="30" fill="url(#mosqueGrad)"/>
      <!-- Crescent on top of dome -->
      <g transform="translate(595, 50)">
        <circle cx="5" cy="5" r="7" fill="#fde68a" opacity="0.7"/>
        <circle cx="8" cy="3" r="5.5" fill="#0f1b35"/>
        <line x1="5" y1="14" x2="5" y2="22" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
      </g>
    </svg>
  </div>

  <!-- ═══════════════════ STAGE CONTAINER ═══════════════════ -->
  <main id="stage">

    <!-- ——— STAGE 1 & 2: Characters ——— -->
    <div id="characters-layer">
      <!-- BULL SVG -->
      <div id="bull-wrap" class="character-wrap">
        <svg id="bull-svg" viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg">
          <!-- Back leg shadow -->
          <path d="M 130 220 L 115 295 C 115 300, 130 300, 130 295 L 150 220 Z" fill="#3D2517"/>
          <path d="M 235 220 L 220 295 C 220 300, 235 300, 235 295 L 255 220 Z" fill="#3D2517"/>
          <!-- Back Hooves -->
          <path d="M 115 290 L 112 300 L 132 300 L 130 290 Z" fill="#1c110a"/>
          <path d="M 220 290 L 217 300 L 237 300 L 235 290 Z" fill="#1c110a"/>

          <!-- Main Body with contour & muscles -->
          <path d="M 90 190 
                   C 70 140, 120 110, 150 110 
                   C 170 110, 190 130, 210 130 
                   C 230 130, 270 120, 280 150 
                   C 290 165, 295 190, 280 220 
                   C 260 250, 210 250, 180 250 
                   C 140 250, 95 240, 90 190 Z" fill="#5C3D2E"/>

          <!-- Muscle highlights & shadows -->
          <path d="M 95 190 C 88 155, 120 120, 145 118 C 120 130, 100 160, 105 195 Z" fill="#6E4A39" opacity="0.6"/>
          <path d="M 190 248 C 145 248, 105 238, 100 200 C 110 230, 145 238, 190 238 Z" fill="#42291D" opacity="0.6"/>

          <!-- Muscular Shoulder / Hump -->
          <path d="M 130 110 C 115 80, 175 75, 185 110 Z" fill="#6E4A39"/>
          <!-- Hump highlight -->
          <path d="M 135 105 C 128 90, 165 85, 175 105 Z" fill="#8A5E49" opacity="0.5"/>

          <!-- Front Legs (Main) -->
          <path d="M 155 220 L 145 298 C 145 303, 165 303, 165 298 L 180 220 Z" fill="#5C3D2E"/>
          <path d="M 255 220 L 248 298 C 248 303, 268 303, 268 298 L 280 220 Z" fill="#5C3D2E"/>
          <!-- Front Hooves -->
          <path d="M 145 293 L 142 303 L 167 303 L 165 293 Z" fill="#2a1a0f"/>
          <path d="M 248 293 L 245 303 L 270 303 L 268 293 Z" fill="#2a1a0f"/>

          <!-- Tail -->
          <path d="M 90 155 Q 50 150 40 200 Q 30 240 45 240 Q 55 240 48 210 Q 55 165 88 165 Z" fill="#42291D"/>
          <!-- Tail Tuft -->
          <path d="M 45 232 C 35 240, 35 260, 48 265 C 55 260, 55 245, 45 232 Z" fill="#2A1A0F"/>

          <!-- Neck & Head group -->
          <g>
            <!-- Neck -->
            <path d="M 250 140 C 270 100, 310 110, 315 150 C 310 180, 270 190, 250 170 Z" fill="#5C3D2E"/>
            <path d="M 262 135 C 275 108, 302 118, 308 145 Z" fill="#6E4A39" opacity="0.6"/>

            <!-- Ears -->
            <path d="M 270 115 C 255 105, 250 90, 260 92 C 270 95, 272 108, 275 115 Z" fill="#42291D"/>
            <path d="M 272 115 C 262 108, 260 100, 266 101 Z" fill="#A8763E" opacity="0.6"/>

            <!-- Head Base -->
            <path d="M 275 120 C 290 100, 335 110, 330 150 C 325 175, 290 180, 275 160 Z" fill="#6E4A39"/>

            <!-- Snout/Muzzle -->
            <path d="M 315 140 C 335 140, 350 150, 345 170 C 340 185, 310 185, 305 170 Z" fill="#D8A060"/>
            <circle cx="332" cy="158" r="4" fill="#5C3D2E"/> <!-- Nostril -->
            <path d="M 318 174 Q 328 178 335 171" stroke="#8A5E49" stroke-width="2.5" fill="none" stroke-linecap="round"/> <!-- Mouth -->

            <!-- Expressive Eye -->
            <ellipse cx="298" cy="138" rx="8" ry="10" fill="#FFFFFF"/>
            <circle cx="300" cy="138" r="5" fill="#42291D"/>
            <circle cx="302" cy="135" r="2" fill="#FFFFFF"/> <!-- Pupil highlight -->
            <!-- Eyelid / Brow -->
            <path d="M 288 132 Q 298 123 308 132" stroke="#2A1A0F" stroke-width="3" fill="none" stroke-linecap="round"/>

            <!-- Curved Horns with shading -->
            <!-- Left Horn (Back) -->
            <path d="M 282 106 Q 275 60 250 50 Q 262 60 286 98 Z" fill="#CBB482"/>
            <!-- Right Horn (Front) -->
            <path d="M 298 112 Q 302 55 280 40 Q 292 55 304 104 Z" fill="#EAD4A2"/>
            <path d="M 292 90 Q 295 62 284 50" stroke="#CBB482" stroke-width="2.5" fill="none"/>

            <!-- Festive Halter/Harness -->
            <path d="M 308 144 Q 320 148 322 170" stroke="#c2185b" stroke-width="4.5" fill="none"/>
            <path d="M 285 125 Q 312 150 312 170" stroke="#c2185b" stroke-width="4.5" fill="none"/>
            <path d="M 292 120 Q 278 145 308 172" stroke="#f9a825" stroke-width="2" fill="none" opacity="0.8"/>
            <circle cx="311" cy="170" r="6.5" fill="#f9a825"/> <!-- Gold Tassel Medallion -->
            <path d="M 311 176 L 311 184" stroke="#f9a825" stroke-width="2.5"/>
          </g>

          <!-- Festive Back Decoration -->
          <path d="M 125 112 Q 185 110 245 136" stroke="#c2185b" stroke-width="7" fill="none" opacity="0.9"/>
          <path d="M 132 119 Q 185 117 238 141" stroke="#f9a825" stroke-width="3.5" fill="none" opacity="0.9"/>
        </svg>
      </div>

      <!-- MAN SVG -->
      <div id="man-wrap" class="character-wrap">
        <svg id="man-svg" viewBox="0 0 240 340" xmlns="http://www.w3.org/2000/svg">
          <g id="man-body-group">
            <!-- Thobe / Robe -->
            <path d="M 90 135 
                     Q 72 180, 68 250 
                     L 65 300 
                     Q 120 305, 175 300 
                     L 172 250 
                     Q 168 180, 150 135 Z" fill="#F4EFE6"/>
            <!-- Robe shading & folds -->
            <path d="M 92 145 Q 78 190 74 250 L 71 300" stroke="#E1D7C6" stroke-width="3.5" fill="none" opacity="0.7"/>
            <path d="M 148 145 Q 162 190 166 250 L 169 300" stroke="#E1D7C6" stroke-width="3.5" fill="none" opacity="0.7"/>
            <path d="M 120 135 L 120 200" stroke="#D3C5AE" stroke-width="2" fill="none" stroke-dasharray="4,4"/>

            <!-- Robe Collar button flap -->
            <path d="M 115 135 L 120 152 L 125 135 Z" fill="#D3C5AE"/>
            <circle cx="120" cy="144" r="2.2" fill="#A8967A"/>

            <!-- Gesturing Right Arm (facing Left, reaching toward bull) -->
            <!-- Upper arm -->
            <path d="M 90 140 Q 60 160 52 188" stroke="#F4EFE6" stroke-width="15" fill="none" stroke-linecap="round"/>
            <path d="M 90 140 Q 60 160 52 188" stroke="#E1D7C6" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.4"/>
            <!-- Sleeve cuff -->
            <ellipse cx="52" cy="188" rx="8.5" ry="5" fill="#D3C5AE" transform="rotate(-15 52 188)"/>
            <!-- Exposed hand gesturing respectfully -->
            <path d="M 52 190 Q 42 196 38 206 C 36 210, 42 215, 46 212 L 56 195 Z" fill="#E8B983"/>
            <path d="M 50 192 Q 38 202 44 208" stroke="#D8A060" stroke-width="1.5" fill="none"/>

            <!-- Left Arm (Resting elegantly at side) -->
            <path d="M 150 140 Q 172 175 168 215" stroke="#F4EFE6" stroke-width="15" fill="none" stroke-linecap="round"/>
            <ellipse cx="168" cy="215" rx="8.5" ry="5" fill="#D3C5AE" transform="rotate(15 168 215)"/>
            <path d="M 168 217 Q 172 225 170 232 C 168 235, 162 232, 162 225 Z" fill="#E8B983"/>

            <!-- Head & Face Group -->
            <g>
              <!-- Neck -->
              <rect x="110" y="115" width="20" height="22" rx="4" fill="#E8B983"/>
              <path d="M 110 128 Q 120 135 130 128" stroke="#D8A060" stroke-width="2" fill="none"/>

              <!-- Face Base -->
              <path d="M 98 90 C 98 75, 142 75, 142 90 C 142 112, 98 112, 98 90 Z" fill="#E8B983"/>

              <!-- Expressive Cartoon Eyes -->
              <ellipse cx="111" cy="90" rx="4.5" ry="6" fill="#FFFFFF"/>
              <circle cx="110" cy="90" r="3.2" fill="#3D2517"/>
              <circle cx="111.5" cy="88.5" r="1.2" fill="#FFFFFF"/> <!-- Eye glint -->

              <ellipse cx="129" cy="90" rx="4.5" ry="6" fill="#FFFFFF"/>
              <circle cx="130" cy="90" r="3.2" fill="#3D2517"/>
              <circle cx="131.5" cy="88.5" r="1.2" fill="#FFFFFF"/> <!-- Eye glint -->

              <!-- Eyebrows -->
              <path d="M 104 82 Q 111 78 117 83" stroke="#20130C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M 123 83 Q 129 78 136 82" stroke="#20130C" stroke-width="2.5" fill="none" stroke-linecap="round"/>

              <!-- Nose -->
              <path d="M 120 90 Q 117 97 120 100" stroke="#D8A060" stroke-width="2" fill="none" stroke-linecap="round"/>

              <!-- Beard & Mustache (Highly detailed cartoon style) -->
              <path d="M 98 93 
                       C 95 105, 102 124, 120 124 
                       C 138 124, 145 105, 142 93 
                       C 138 108, 102 108, 98 93 Z" fill="#20130C"/>
              <!-- Mustache -->
              <path d="M 110 99 Q 120 104 130 99 Q 120 101 110 99 Z" fill="#150C08"/>

              <!-- Friendly Smile -->
              <path d="M 115 104 Q 120 109 125 104" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>

              <!-- Keffiyeh / Ghutra (Traditional head covering with beautiful drapery) -->
              <!-- Top Cap part -->
              <path d="M 94 85 C 94 65, 146 65, 146 85 Z" fill="#FFFFFF"/>
              <!-- Agal (Dual black cord) -->
              <path d="M 95 72 Q 120 66 145 72" stroke="#1C110A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M 98 76 Q 120 71 142 76" stroke="#2D1C11" stroke-width="3" fill="none" stroke-linecap="round"/>
              <!-- Side drapes flowing down behind shoulders -->
              <path d="M 95 80 C 82 85, 78 110, 82 145 C 84 155, 92 165, 92 145 C 92 110, 96 90, 96 80 Z" fill="#FFFFFF"/>
              <path d="M 145 80 C 158 85, 162 110, 158 145 C 156 155, 148 165, 148 145 C 148 110, 144 90, 144 80 Z" fill="#FFFFFF"/>
              <!-- Subtle folds inside drapes -->
              <path d="M 85 95 Q 83 120 85 140" stroke="#E1D7C6" stroke-width="1.5" fill="none"/>
              <path d="M 155 95 Q 157 120 155 140" stroke="#E1D7C6" stroke-width="1.5" fill="none"/>
            </g>

            <!-- Sandals & Feet -->
            <path d="M 90 302 C 85 302, 80 307, 85 312 C 92 312, 102 312, 105 307 Z" fill="#E8B983"/>
            <path d="M 135 307 C 138 312, 148 312, 155 312 C 160 307, 155 302, 150 302 Z" fill="#E8B983"/>
            <!-- Sandals -->
            <path d="M 80 310 L 108 310" stroke="#42291D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M 132 310 L 160 310" stroke="#42291D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- ——— STAGE 3: Greeting Text ——— -->
    <div id="greeting-layer">
      <div id="greeting-inner">
        <!-- Bismillah decoration -->
        <div id="bismillah-decor">
          <svg viewBox="0 0 300 40" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="20" x2="90" y2="20" stroke="url(#goldLine)" stroke-width="1.5"/>
            <circle cx="100" cy="20" r="4" fill="#d4a04a"/>
            <circle cx="115" cy="20" r="2.5" fill="#d4a04a" opacity="0.7"/>
            <circle cx="125" cy="20" r="4" fill="#d4a04a"/>
            <path d="M138 12 Q150 4 162 12" stroke="#d4a04a" stroke-width="1.5" fill="none"/>
            <path d="M138 28 Q150 36 162 28" stroke="#d4a04a" stroke-width="1.5" fill="none"/>
            <circle cx="175" cy="20" r="4" fill="#d4a04a"/>
            <circle cx="185" cy="20" r="2.5" fill="#d4a04a" opacity="0.7"/>
            <circle cx="200" cy="20" r="4" fill="#d4a04a"/>
            <line x1="210" y1="20" x2="300" y2="20" stroke="url(#goldLine2)" stroke-width="1.5"/>
            <defs>
              <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#d4a04a" stop-opacity="0"/>
                <stop offset="100%" stop-color="#d4a04a"/>
              </linearGradient>
              <linearGradient id="goldLine2" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#d4a04a"/>
                <stop offset="100%" stop-color="#d4a04a" stop-opacity="0"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

        <h1 id="greeting-title">
          <span class="g-word" data-i="0">Eid</span>
          <span class="g-word" data-i="1">Ul</span>
          <span class="g-word" data-i="2">Adha</span>
          <span class="g-word" data-i="3">Mubarak</span>
        </h1>

        <!-- Arabic calligraphy accent -->
        <p id="greeting-arabic">عيد الأضحى مبارك</p>

        <div id="bismillah-decor-bottom">
          <svg viewBox="0 0 300 40" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="20" x2="90" y2="20" stroke="url(#goldLine)" stroke-width="1.5"/>
            <circle cx="100" cy="20" r="4" fill="#d4a04a"/>
            <circle cx="150" cy="20" r="6" fill="none" stroke="#d4a04a" stroke-width="1.5"/>
            <circle cx="150" cy="20" r="2" fill="#d4a04a"/>
            <circle cx="200" cy="20" r="4" fill="#d4a04a"/>
            <line x1="210" y1="20" x2="300" y2="20" stroke="url(#goldLine2)" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <!-- Confetti / sparkle canvas -->
      <canvas id="confetti-canvas"></canvas>
    </div>

    <!-- ——— STAGE 4: Community ——— -->
    <div id="community-layer">
      <p id="community-subtitle">Wishing you and your family a blessed Eid</p>

      <div id="community-figures">
        <!-- Pair 1: Hugging -->
        <svg class="community-pair" viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
          <g opacity="0.85">
            <!-- Person A -->
            <circle cx="55" cy="45" r="18" fill="#1a1a3e"/>
            <path d="M55 63 Q55 100 50 140 L35 140 Q38 100 40 80 Q42 70 55 63Z" fill="#1a1a3e"/>
            <path d="M55 63 Q55 100 60 140 L75 140 Q72 100 70 80 Q68 70 55 63Z" fill="#1a1a3e"/>
            <!-- Person A arm (hugging B) -->
            <path d="M60 75 Q80 70 90 80" stroke="#1a1a3e" stroke-width="8" fill="none" stroke-linecap="round"/>
            <!-- Person B -->
            <circle cx="95" cy="45" r="18" fill="#2d2d5e"/>
            <path d="M95 63 Q95 100 90 140 L75 140 Q78 100 80 80 Q82 70 95 63Z" fill="#2d2d5e"/>
            <path d="M95 63 Q95 100 100 140 L115 140 Q112 100 110 80 Q108 70 95 63Z" fill="#2d2d5e"/>
            <!-- Person B arm (hugging A) -->
            <path d="M90 75 Q70 70 60 80" stroke="#2d2d5e" stroke-width="8" fill="none" stroke-linecap="round"/>
            <!-- Heart -->
            <g transform="translate(72, 28) scale(0.5)" class="pulse-heart">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#c2185b" opacity="0.7"/>
            </g>
          </g>
        </svg>

        <!-- Pair 2: Handshake -->
        <svg class="community-pair" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg">
          <g opacity="0.85">
            <!-- Person C -->
            <circle cx="45" cy="45" r="18" fill="#1a3e1a"/>
            <path d="M45 63 Q45 100 40 140 L25 140 Q28 100 30 80 Q32 70 45 63Z" fill="#1a3e1a"/>
            <path d="M45 63 Q45 100 50 140 L65 140 Q62 100 60 80 Q58 70 45 63Z" fill="#1a3e1a"/>
            <!-- Person C arm reaching -->
            <path d="M55 80 Q68 85 80 90" stroke="#1a3e1a" stroke-width="7" fill="none" stroke-linecap="round"/>
            <!-- Person D -->
            <circle cx="115" cy="45" r="18" fill="#3e2d1a"/>
            <path d="M115 63 Q115 100 110 140 L95 140 Q98 100 100 80 Q102 70 115 63Z" fill="#3e2d1a"/>
            <path d="M115 63 Q115 100 120 140 L135 140 Q132 100 130 80 Q128 70 115 63Z" fill="#3e2d1a"/>
            <!-- Person D arm reaching -->
            <path d="M105 80 Q92 85 80 90" stroke="#3e2d1a" stroke-width="7" fill="none" stroke-linecap="round"/>
            <!-- Handshake symbol -->
            <circle cx="80" cy="90" r="6" fill="none" stroke="#d4a04a" stroke-width="1.5" opacity="0.7"/>
          </g>
        </svg>

        <!-- Pair 3: Hugging (variant) -->
        <svg class="community-pair" viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
          <g opacity="0.85">
            <!-- Person E (taller) -->
            <circle cx="55" cy="38" r="20" fill="#2e1a3e"/>
            <path d="M55 58 Q55 100 50 145 L35 145 Q38 100 40 80 Q42 68 55 58Z" fill="#2e1a3e"/>
            <path d="M55 58 Q55 100 60 145 L75 145 Q72 100 70 80 Q68 68 55 58Z" fill="#2e1a3e"/>
            <!-- Arm hugging -->
            <path d="M62 72 Q82 68 92 78" stroke="#2e1a3e" stroke-width="7" fill="none" stroke-linecap="round"/>
            <!-- Person F (shorter – child) -->
            <circle cx="92" cy="55" r="14" fill="#3e1a2e"/>
            <path d="M92 69 Q92 100 88 145 L78 145 Q80 100 82 85 Q84 75 92 69Z" fill="#3e1a2e"/>
            <path d="M92 69 Q92 100 96 145 L106 145 Q104 100 102 85 Q100 75 92 69Z" fill="#3e1a2e"/>
            <!-- Child arm -->
            <path d="M85 78 Q72 75 65 80" stroke="#3e1a2e" stroke-width="6" fill="none" stroke-linecap="round"/>
            <!-- Sparkle -->
            <g transform="translate(105, 42)" class="pulse-heart">
              <polygon points="6,0 7.5,4.5 12,6 7.5,7.5 6,12 4.5,7.5 0,6 4.5,4.5" fill="#fde68a" opacity="0.7"/>
            </g>
          </g>
        </svg>

        <!-- Pair 4: Handshake variant -->
        <svg class="community-pair hidden-mobile" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg">
          <g opacity="0.85">
            <circle cx="48" cy="45" r="18" fill="#1a2e3e"/>
            <path d="M48 63 Q48 100 43 140 L28 140 Q31 100 33 80 Q35 70 48 63Z" fill="#1a2e3e"/>
            <path d="M48 63 Q48 100 53 140 L68 140 Q65 100 63 80 Q61 70 48 63Z" fill="#1a2e3e"/>
            <path d="M58 80 Q71 85 82 90" stroke="#1a2e3e" stroke-width="7" fill="none" stroke-linecap="round"/>
            <circle cx="112" cy="45" r="18" fill="#3e3e1a"/>
            <path d="M112 63 Q112 100 107 140 L92 140 Q95 100 97 80 Q99 70 112 63Z" fill="#3e3e1a"/>
            <path d="M112 63 Q112 100 117 140 L132 140 Q129 100 127 80 Q125 70 112 63Z" fill="#3e3e1a"/>
            <path d="M102 80 Q89 85 82 90" stroke="#3e3e1a" stroke-width="7" fill="none" stroke-linecap="round"/>
            <circle cx="82" cy="90" r="6" fill="none" stroke="#d4a04a" stroke-width="1.5" opacity="0.7"/>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
